# The gate. Every push and every pull request runs the same command a developer runs locally.
#
# `npm ci` rather than `npm install` installs strictly from the committed lockfile and fails if `package.json`
# and that lockfile disagree. That makes this job the proof of Task 0.1 (the pinned npm cache and regenerated
# lockfile) rather than a second, looser path. A rename in `package.json` therefore has to move the lockfile
# in the same commit.
#
# `npm run verify` is the whole gate: lint, typecheck (source *and* tests), build, test, size. There is no
# second definition of it here. A workflow that re-lists the steps drifts from the script the moment either
# changes, and CI would then be testing something a developer cannot reproduce.

name: ci

on:
  push:
    branches: ['**']
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Node 22 matches `engines.node` in `package.json` (>=22). The two disagreeing is a green light for a
      # configuration the package does not claim, so if either moves, this line moves with it.
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install from the lockfile
        run: npm ci

      - name: Verify (lint, typecheck, build, test)
        run: npm run verify

      # The userscript artifact is not built here any more. Starting a client, publishing the page namespace
      # and rendering a status badge are an application of `@mg.js/bootstrapped`, and they moved to the
      # example userscript's own repository, which owns that bundle, its Tampermonkey banner and its size
      # budget. This workflow gates the libraries.
